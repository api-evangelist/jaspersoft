aid: jaspersoft
name: Jaspersoft
description: >-
  Jaspersoft is a business intelligence and embedded analytics platform, now part of
  Cloud Software Group (formerly TIBCO). Its flagship products are the open-source
  JasperReports Library — a Java reporting engine (net.sf.jasperreports) — and
  JasperReports Server, a reporting and analytics server that exposes a REST API
  (rest_v2) for managing the repository, running and scheduling reports, executing
  queries, and administering users, roles, and organizations. Developers embed
  Jaspersoft content into their own applications with Visualize.js and the js-visualize
  component library, and interact with the server programmatically through official
  Java and PHP REST clients. Sector: data analytics / business intelligence. Backed by
  Sapphire Ventures; surfaced into the API Evangelist network as a portfolio company.
